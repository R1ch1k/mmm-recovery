[project]
name = "mmm-recovery"
version = "0.1.0"
description = "Pre-registered test of whether Marketing Mix Modelling recovers known ground truth."
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richik Mandal" }]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
]

# The core grid must run without this. Meridian is the verify-not-trust anchor
# (PREREGISTRATION.md §4) and drags in TensorFlow; it stays opt-in.
[project.optional-dependencies]
meridian = [
    "google-meridian",
    "tensorflow-probability",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name is mmm-recovery; the import package is mmm_recovery.
[tool.hatch.build.targets.wheel]
packages = ["src/mmm_recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# NPY is deliberate: NPY002 bans the legacy global np.random seed API, which is
# the single easiest way to break the determinism rule in CLAUDE.md.
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.coverage.run]
source = ["src/mmm_recovery"]
