[project]
name = "mmm-recovery"
version = "0.1.0"
description = "Pre-registered test of whether Marketing Mix Modelling recovers known ground truth."
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richik Mandal" }]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
]

# The core grid must run without this. Meridian is the verify-not-trust anchor
# (PREREGISTRATION.md §4) and drags in TensorFlow; it stays opt-in.
[project.optional-dependencies]
# The dashboard only. Plotly is vendored into a single self-contained HTML file
# (PREREGISTRATION.md's reporting requirement), so it is a build-time dependency of
# `make report` and never a run-time one for the grid.
report = [
    "plotly>=5.24",
]
meridian = [
    "google-meridian",
    "tensorflow-probability",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Real stubs, so scipy calls are actually type-checked rather than waved through
    # with ignore_missing_imports.
    "scipy-stubs>=1.14",
    "pandas-stubs>=3.0.5.260730",
    "playwright>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name is mmm-recovery; the import package is mmm_recovery.
[tool.hatch.build.targets.wheel]
packages = ["src/mmm_recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# NPY is deliberate: NPY002 bans the legacy global np.random seed API, which is
# the single easiest way to break the determinism rule in CLAUDE.md.
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "NPY"]
# RUF001-003 flag Greek letters as homoglyphs of Latin ones (α looks like a). That rule
# guards against confusable identifiers in hostile source; here the Greek symbols are the
# notation PREREGISTRATION.md itself uses for λ, α, κ, β, ρ, φ, γ and τ, and matching the
# spec character-for-character is worth more than the homoglyph check in a repo with no
# untrusted contributors.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# google-meridian ships no py.typed marker, so strict mode cannot see through it. Scoped to
# the one optional dependency rather than relaxed globally: everything the study's own
# conclusions run through stays fully checked.
[[tool.mypy.overrides]]
module = ["meridian.*"]
ignore_missing_imports = true

# plotly ships no py.typed marker either. Same reasoning and the same narrow scope: it is
# reached only by `report.py`, which draws the dashboard and computes nothing the study
# concludes from.
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/mmm_recovery"]
